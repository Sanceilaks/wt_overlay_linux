name: Publish release archive

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and attach Linux archive
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libwayland-dev

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Create release archive
        run: |
          install -Dm755 target/release/wt-overlay-linux dist/wt-overlay-linux/wt-overlay-linux
          install -Dm644 config.example.toml dist/wt-overlay-linux/config.example.toml
          install -Dm644 hud.example.scm dist/wt-overlay-linux/hud.example.scm
          install -Dm644 assets/fonts/LICENSE-Noto.txt dist/wt-overlay-linux/licenses/LICENSE-Noto.txt
          tar -C dist -czf dist/wt-overlay-linux-x86_64-unknown-linux-gnu.tar.gz wt-overlay-linux
          cd dist
          sha256sum wt-overlay-linux-x86_64-unknown-linux-gnu.tar.gz > wt-overlay-linux-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Attach archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/wt-overlay-linux-x86_64-unknown-linux-gnu.tar.gz \
            dist/wt-overlay-linux-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            --clobber
