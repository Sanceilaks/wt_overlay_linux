[package]
name = "wt_overlay_linux"
version = "0.1.0"
edition = "2024"
description = "A scriptable Wayland HUD overlay for War Thunder telemetry"
license = "WTFPL"
repository = "https://github.com/Sanceilaks/wt_overlay_linux"
keywords = ["war-thunder", "wayland", "hud", "overlay", "telemetry"]
categories = ["games", "visualization"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "tests/fixtures/**",
  "assets/fonts/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "SCRIPTING.md",
  "LICENSE",
  "config.example.toml",
  "hud.example.scm",
]

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.7.1"
calloop = "0.14.4"
glyphon = "0.12.0"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = [
  "calloop", "system",
] }
steel-core = "0.8.3"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
ureq = { version = "3.1.4", features = ["json"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wgpu = "30.0.1"

[[bin]]
name = "wt-overlay-linux"
path = "src/main.rs"
